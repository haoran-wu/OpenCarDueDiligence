[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "opencarduediligence-api"
version = "0.1.0a3"
description = "Evidence-backed US used-car due diligence API"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "celery[redis]>=5.4,<6",
  "cryptography>=48.0.1,<50",
  "fastapi>=0.111,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pypdf>=6.13.3,<7",
  "python-multipart>=0.0.9,<1",
  "reportlab>=4.2,<5",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
cloud = [
  "boto3>=1.34,<2",
  "psycopg[binary]>=3.1,<4",
]
dev = [
  "httpx>=0.27,<1",
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
test = [
  "httpx>=0.27,<1",
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
