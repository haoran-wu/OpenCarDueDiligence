[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ocdd-obd-bridge"
version = "0.1.0"
description = "Read-only local BLE ELM327 bridge for OpenCarDueDiligence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "bleak>=0.22,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["obd_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
