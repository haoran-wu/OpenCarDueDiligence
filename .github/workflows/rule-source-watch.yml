name: Official rule source watch

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare official DMV source fingerprints
        run: python scripts/check_rule_sources.py | tee rule-source-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rule-source-report
          path: rule-source-report.json
