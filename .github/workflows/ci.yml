name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and candidate smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'services/api[dev,cloud]' -e 'services/worker[dev]' -e 'services/obd-bridge[dev]'
      - name: Lint Python sources
        run: python -m ruff check services scripts
      - name: Run Python tests
        env:
          PYTHONPATH: services/api
        run: python -m pytest -q services/api/tests services/worker/tests services/obd-bridge/tests
      - name: Run deterministic candidate smoke
        run: python scripts/smoke_v1.py

  node:
    name: TypeScript tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: Dependency security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Audit Python runtime dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e 'services/api[cloud]' -e services/worker -e services/obd-bridge
          pip-audit --progress-spinner off
      - name: Audit production Node dependencies
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

  compose:
    name: Build and smoke local Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose manifests
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.cloud.yml config --quiet
      - name: Build and start the loopback-only local stack
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Verify API and web health
        run: |
          curl --fail --show-error --silent http://127.0.0.1:8000/health
          curl --fail --show-error --silent http://127.0.0.1:3000/ >/dev/null
          docker compose ps
      - name: Show service logs after a failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the local stack
        if: always()
        run: docker compose down --volumes --remove-orphans
