name: Bug report
description: Report a reproducible defect using synthetic or safely redacted data
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        OpenCarDueDiligence is alpha software. Never post a real VIN, title, identity document, seller address, private message, paid report, credential, cookie, or unredacted log. Use GitHub private vulnerability reporting for security/privacy issues.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and scope
      options:
        - label: I used synthetic or safely redacted data and removed secrets and personal information.
          required: true
        - label: This is not a security or privacy vulnerability.
          required: true
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: API, Web, extension, worker/OCR, OBD bridge, rule pack, report, deployment
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Commit SHA, branch, or v0.1 candidate date
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Include the expected fail-closed or unknown behavior where relevant.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide commands and a synthetic fixture or payload. Do not upload a paid report.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python, Node, browser, Docker/Compose, deployment mode; BLE adapter profile if relevant
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
      description: Optional. Confirm again that all case and identity data is synthetic or removed.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks performed
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I can reproduce this on the current default branch.
          required: false
