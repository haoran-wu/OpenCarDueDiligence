{
  "schema_version": "1.0",
  "checklist_version": "2026.07.12",
  "title_en": "Five-stage used-vehicle inspection",
  "title_zh": "五阶段二手车检查",
  "license": "CC-BY-SA-4.0",
  "default_result": "UNKNOWN",
  "allowed_results": ["UNKNOWN", "PASS", "CONCERN", "FAIL", "NOT_APPLICABLE"],
  "unknown_policy": "An unperformed or undocumented check remains UNKNOWN and must never be rendered as healthy or passed.",
  "provenance": {
    "publisher": "OpenCarDueDiligence contributors",
    "method": "Original buyer checklist informed by FTC and NHTSA consumer guidance; it does not reproduce a proprietary inspection checklist.",
    "reviewed_at": "2026-07-12"
  },
  "sources": [
    {"id": "ftc-used-car", "title": "Buying a Used Car From a Dealer", "url": "https://consumer.ftc.gov/articles/buying-used-car-dealer", "publisher": "Federal Trade Commission", "verified_at": "2026-07-12"},
    {"id": "nhtsa-vin-recall", "title": "Vehicle Safety Recalls Week: Check for Recalls", "url": "https://www.nhtsa.gov/recalls", "publisher": "National Highway Traffic Safety Administration", "verified_at": "2026-07-12"}
  ],
  "stages": [
    {
      "id": "pre_visit",
      "order": 1,
      "title_en": "Before the visit",
      "title_zh": "看车前",
      "items": [
        {"id": "vin_received", "label_en": "Obtain the full VIN before traveling.", "label_zh": "出发前取得完整 VIN。", "weight": 3, "critical": true, "evidence": ["listing_or_seller_message"]},
        {"id": "title_photo_redacted", "label_en": "Request a redacted title photo showing VIN, state, title status, and lien area.", "label_zh": "索要打码后的 title 照片，保留 VIN、州、title 状态和 lien 栏。", "weight": 3, "critical": true, "evidence": ["redacted_title_photo"]},
        {"id": "seller_identity_match_plan", "label_en": "Confirm the seller will show ID for an in-person name match; do not store the raw name in cloud data.", "label_zh": "确认卖家现场出示证件核对姓名；云端不保存原始姓名。", "weight": 3, "critical": true, "evidence": ["match_result_only"]},
        {"id": "cold_start_requested", "label_en": "Ask the seller not to start or warm the vehicle before arrival.", "label_zh": "要求卖家到达前不要启动或热车。", "weight": 2, "critical": false, "evidence": ["seller_acknowledgement"]},
        {"id": "ppi_permission", "label_en": "Obtain permission for an independent pre-purchase inspection and road test.", "label_zh": "取得独立 PPI 和道路试驾许可。", "weight": 3, "critical": true, "evidence": ["seller_acknowledgement"]},
        {"id": "service_records", "label_en": "Request maintenance invoices, inspection rejection notices, recall completion records, and both keys.", "label_zh": "索要保养发票、验车拒绝单、召回完成记录及全部钥匙。", "weight": 2, "critical": false, "evidence": ["documents_or_unknown"]},
        {"id": "recall_lookup", "label_en": "Check open recalls by VIN with NHTSA and the manufacturer; model-level recall data cannot prove completion.", "label_zh": "用 VIN 在 NHTSA 和厂家查询未完成召回；车型级数据不能证明该车已完成召回。", "weight": 2, "critical": false, "evidence": ["VIN_level_lookup"]}
      ]
    },
    {
      "id": "exterior_structure",
      "order": 2,
      "title_en": "Exterior and structure",
      "title_zh": "外观与结构",
      "items": [
        {"id": "vin_all_locations", "label_en": "Match VIN on dashboard, door label, title, and diagnostic scan.", "label_zh": "核对仪表台、车门标签、title 和诊断扫描上的 VIN。", "weight": 3, "critical": true, "evidence": ["photos", "document_match"]},
        {"id": "panel_gaps", "label_en": "Compare panel gaps, fasteners, seam sealer, paint texture, and color in consistent light.", "label_zh": "在一致光线下比较钣金缝隙、螺丝、密封胶、漆面纹理和色差。", "weight": 2, "critical": false, "evidence": ["photos", "manual_observation"]},
        {"id": "overspray_welds", "label_en": "Look for overspray, masking lines, disturbed welds, wrinkled metal, or replacement labels.", "label_zh": "检查漆雾、遮蔽线、焊点变化、金属褶皱或更换标签。", "weight": 3, "critical": true, "evidence": ["photos", "ppi_if_concern"]},
        {"id": "glass_lamps", "label_en": "Record glass date codes, cracks, chips, lamp moisture, and lamp self-leveling where equipped.", "label_zh": "记录玻璃日期码、裂纹、崩点、灯内水汽及配备车型的自动调平。", "weight": 1, "critical": false, "evidence": ["photos"]},
        {"id": "tires", "label_en": "Record tire DOT dates, size match, tread depth across each tire, sidewall damage, and uneven wear.", "label_zh": "记录轮胎 DOT 日期、尺寸一致性、各位置胎纹、胎壁损伤和偏磨。", "weight": 2, "critical": true, "evidence": ["measurements", "photos"]},
        {"id": "rust", "label_en": "Inspect subframes, pinch welds, brake/fuel lines, suspension mounts, rocker panels, and floor for corrosion.", "label_zh": "检查副车架、顶车边、刹车/燃油管、悬挂固定点、门槛和底板锈蚀。", "weight": 3, "critical": true, "evidence": ["photos", "lift_inspection"]},
        {"id": "flood_signs", "label_en": "Check low cavities, spare-tire well, connectors, seat rails, and under-carpet areas for silt, odor, or water marks.", "label_zh": "检查低位空腔、备胎槽、插头、座椅滑轨和地毯下方有无泥沙、异味或水线。", "weight": 3, "critical": true, "evidence": ["photos", "manual_observation"]},
        {"id": "fluid_ground", "label_en": "Inspect the ground and lower engine/transmission/axle areas for fresh fluid.", "label_zh": "检查地面及发动机、变速箱、车轴下部有无新鲜液体。", "weight": 2, "critical": true, "evidence": ["photos", "manual_observation"]}
      ]
    },
    {
      "id": "interior_electrical",
      "order": 3,
      "title_en": "Interior and electrical",
      "title_zh": "内饰与电气",
      "items": [
        {"id": "warning_lamp_self_test", "label_en": "With ignition on, verify MIL, ABS, SRS, and other required warning lamps illuminate and then behave normally after start.", "label_zh": "通电时确认 MIL、ABS、SRS 等警告灯会亮起，启动后按正常逻辑熄灭。", "weight": 3, "critical": true, "evidence": ["video"]},
        {"id": "module_coverage", "label_en": "Record which modules were actually scanned; unscanned ABS/SRS/body modules remain UNKNOWN.", "label_zh": "记录实际扫描了哪些模块；未扫描的 ABS/SRS/车身模块保持 UNKNOWN。", "weight": 3, "critical": true, "evidence": ["scan_metadata"]},
        {"id": "moisture", "label_en": "Check carpets, headliner, pillars, spare-tire well, and cabin filter area for moisture or mold.", "label_zh": "检查地毯、顶棚、立柱、备胎槽和空调滤芯区域是否潮湿或发霉。", "weight": 2, "critical": true, "evidence": ["photos", "manual_observation"]},
        {"id": "hvac", "label_en": "Test heat, cold A/C, blower speeds, vent direction, recirculation, and defrost.", "label_zh": "测试暖风、冷气、各档风量、出风方向、内循环和除霜。", "weight": 1, "critical": false, "evidence": ["manual_observation"]},
        {"id": "switches", "label_en": "Test windows, locks, mirrors, horn, wipers, washers, lights, outlets, camera, and infotainment.", "label_zh": "测试车窗、门锁、后视镜、喇叭、雨刷/喷水、灯光、电源、摄像头和车机。", "weight": 1, "critical": false, "evidence": ["manual_observation"]},
        {"id": "roof", "label_en": "Operate sunroof or convertible roof through a full cycle and inspect drains, seals, and warning messages.", "label_zh": "让天窗或敞篷完整运行一轮，并检查排水、密封和警告信息。", "weight": 2, "critical": false, "applicability": "if_equipped", "evidence": ["video"]},
        {"id": "restraints", "label_en": "Inspect seat belts, buckles, seats, head restraints, and visible airbag covers for damage or tampering.", "label_zh": "检查安全带、卡扣、座椅、头枕和可见气囊盖是否损坏或被动过。", "weight": 3, "critical": true, "evidence": ["photos", "manual_observation"]},
        {"id": "keys", "label_en": "Test every supplied key, remote, immobilizer, and emergency blade.", "label_zh": "测试全部钥匙、遥控、芯片防盗和机械应急钥匙。", "weight": 1, "critical": false, "evidence": ["manual_observation"]}
      ]
    },
    {
      "id": "cold_start_road_test",
      "order": 4,
      "title_en": "Cold start and road test",
      "title_zh": "冷启动与试驾",
      "items": [
        {"id": "cold_verified", "label_en": "Verify the engine is cold using coolant temperature/live data or careful touch before start.", "label_zh": "启动前用冷却液温度/实时数据或谨慎触摸确认发动机为冷车。", "weight": 2, "critical": false, "evidence": ["live_data_or_observation"]},
        {"id": "start_quality", "label_en": "Observe crank time, idle stability, smoke, fuel smell, warning lights, and abnormal mechanical noise.", "label_zh": "观察启动时间、怠速稳定性、烟雾、燃油味、警告灯和异常机械声。", "weight": 3, "critical": true, "evidence": ["video", "manual_observation"]},
        {"id": "fluids_temperature", "label_en": "Watch coolant temperature and warning messages; stop for overheating, oil-pressure warning, or major fluid loss.", "label_zh": "观察水温和警告；若过热、机油压力报警或大量漏液立即停止。", "weight": 3, "critical": true, "evidence": ["live_data", "dashboard_photo"]},
        {"id": "transmission", "label_en": "Test engagement and shifts cold and warm, including reverse; record flare, slip, shudder, delay, grinding, or harsh engagement.", "label_zh": "冷车和热车测试前进/倒挡结合与换挡，记录转速飘升、打滑、抖动、延迟、齿轮声或冲击。", "weight": 3, "critical": true, "evidence": ["road_test_notes"]},
        {"id": "clutch", "label_en": "For a manual, assess clutch take-up, slip under load, chatter, pedal feel, synchronizers, and release-bearing noise.", "label_zh": "手动挡检查离合结合点、负载打滑、抖动、踏板、同步器和分离轴承噪音。", "weight": 3, "critical": true, "applicability": "manual_only", "evidence": ["road_test_notes"]},
        {"id": "brakes", "label_en": "Test straight, progressive braking and parking brake; record pulsation, pull, noise, weak assist, or warning lamps.", "label_zh": "测试直线渐进制动和驻车制动，记录抖动、跑偏、异响、助力不足或警告灯。", "weight": 3, "critical": true, "evidence": ["road_test_notes"]},
        {"id": "steering_suspension", "label_en": "Check steering centering, assist, play, wheel-bearing hum, clunks, bounce, and vibration over varied surfaces.", "label_zh": "在不同路面检查方向回正、助力、间隙、轴承嗡鸣、底盘撞击、弹跳和振动。", "weight": 2, "critical": true, "evidence": ["road_test_notes"]},
        {"id": "highway_load", "label_en": "Where safe and legal, test sustained speed and moderate load for boost, cooling, misfire, vibration, and transmission behavior.", "label_zh": "在安全合法条件下测试持续车速和中等负载下的增压、冷却、失火、振动和换挡。", "weight": 2, "critical": false, "evidence": ["road_test_notes", "post_drive_scan"]},
        {"id": "post_drive_scan", "label_en": "Re-scan stored, pending, and permanent codes and readiness after the road test without clearing anything.", "label_zh": "试驾后再次读取 stored、pending、permanent codes 和 readiness，绝不清码。", "weight": 3, "critical": true, "evidence": ["diagnostic_scan"]}
      ]
    },
    {
      "id": "lift_ppi",
      "order": 5,
      "title_en": "Lift inspection / professional PPI",
      "title_zh": "举升检查 / 专业 PPI",
      "items": [
        {"id": "structural_underbody", "label_en": "Inspect rails, subframes, mounting points, floor, prior pulls/welds, and corrosion on a lift.", "label_zh": "举升检查纵梁、副车架、固定点、底板、拉伸/焊修痕迹和锈蚀。", "weight": 3, "critical": true, "evidence": ["technician_report", "photos"]},
        {"id": "leaks", "label_en": "Identify source and severity of engine oil, transmission fluid, coolant, fuel, brake fluid, and differential leaks.", "label_zh": "确认机油、变速箱油、冷却液、燃油、刹车油和差速器渗漏的来源及程度。", "weight": 3, "critical": true, "evidence": ["technician_report", "photos"]},
        {"id": "brake_measurements", "label_en": "Measure pad/rotor condition, inspect hoses and hard lines, verify caliper movement and fluid condition.", "label_zh": "测量刹车片/盘，检查软管和硬管、卡钳活动及刹车油状态。", "weight": 3, "critical": true, "evidence": ["measurements"]},
        {"id": "steering_suspension_lift", "label_en": "Check ball joints, tie rods, control-arm bushings, struts/shocks, wheel bearings, CV joints, and boots.", "label_zh": "检查球头、拉杆、控制臂胶套、减震器、轮毂轴承、CV 万向节和防尘套。", "weight": 2, "critical": true, "evidence": ["technician_report"]},
        {"id": "exhaust_emissions", "label_en": "Inspect exhaust leaks, catalyst damage/tampering, oxygen-sensor wiring, and emissions equipment.", "label_zh": "检查排气泄漏、催化器损坏/改动、氧传感器线路和排放设备。", "weight": 2, "critical": true, "evidence": ["technician_report"]},
        {"id": "cooling_pressure", "label_en": "Pressure-test the cooling system when age, model risk, residue, odor, or history warrants it.", "label_zh": "当车龄、车型风险、残留物、气味或历史提示时，对冷却系统做压力测试。", "weight": 2, "critical": false, "applicability": "technician_indicated", "evidence": ["test_result"]},
        {"id": "compression_leakdown", "label_en": "Perform compression/leak-down or relative-compression testing when misfire, smoke, noise, or model risk warrants it.", "label_zh": "当失火、冒烟、异响或车型风险提示时，做缸压/泄漏或相对压缩测试。", "weight": 3, "critical": false, "applicability": "technician_indicated", "evidence": ["measurements"]},
        {"id": "hybrid_ev_battery", "label_en": "For hybrid/EV vehicles, obtain battery health, module/cell balance, isolation, thermal, and charging-system results with appropriate equipment.", "label_zh": "混动/纯电车使用合适设备检查电池健康、模块/单体均衡、绝缘、热管理和充电系统。", "weight": 3, "critical": true, "applicability": "hybrid_or_EV", "evidence": ["specialist_report"]},
        {"id": "full_module_scan", "label_en": "Use a capable scan tool for powertrain, ABS, SRS, body, transmission, hybrid/EV, and manufacturer modules; preserve the report.", "label_zh": "用合适设备扫描动力、ABS、SRS、车身、变速箱、混动/EV 和厂家模块，并保存报告。", "weight": 3, "critical": true, "evidence": ["full_scan_report"]}
      ]
    }
  ]
}
