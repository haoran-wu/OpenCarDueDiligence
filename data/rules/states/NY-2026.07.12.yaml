  "seller_tasks": [
    {"id": "ny-seller-assign-title", "order": 10, "text_en": "The titled owner completes and signs the transfer section of the original title, including odometer and damage disclosure where shown.", "text_zh": "title 所列车主填写并签署原始 title 的转让栏，包括页面要求的里程和损伤披露。", "source_id": "ny-transfer"},
    {"id": "ny-seller-bill-sale", "order": 20, "text_en": "Seller and buyer sign an original MV-912 or equivalent bill of sale containing year/make, VIN, date, price, and both names/signatures.", "text_zh": "买卖双方签署 MV-912 原件或等效 bill of sale，包含年款/品牌、VIN、日期、价格及双方姓名签名。", "source_id": "ny-transfer"},
    {"id": "ny-seller-no-open-title", "order": 30, "text_en": "Do not accept an open title: the seller must be the owner shown on the ownership proof or a properly documented authorized signer.", "text_zh": "不要接受 open title：卖家必须是所有权文件上的车主或有正确书面授权的签字人。", "source_id": "ny-proof-ownership"},
    {"id": "ny-seller-remove-plates", "order": 40, "text_en": "The seller keeps and surrenders or transfers New York plates; they do not transfer with the vehicle.", "text_zh": "卖家保留并交回或转用纽约车牌；车牌不会随车辆转让。", "source_id": "ny-transfer"}
  ],
  "buyer_tasks": [
    {"id": "ny-buyer-ownership", "order": 10, "phase": "at_sale", "text_en": "Receive the properly assigned original title and original signed bill of sale before payment.", "text_zh": "付款前取得正确转签的原始 title 和已签字的 bill of sale 原件。", "source_id": "ny-transfer"},
    {"id": "ny-buyer-tax-form", "order": 20, "phase": "registration", "text_en": "If registering or titling in New York, complete DTF-802 and pay or document sales tax at DMV.", "text_zh": "若在纽约办理 title/registration，填写 DTF-802 并在 DMV 缴纳或证明销售税。", "source_id": "ny-sales-tax"},
    {"id": "ny-buyer-insure", "order": 30, "phase": "before_driving", "text_en": "Obtain insurance acceptable for the chosen registration or in-transit permit before driving.", "text_zh": "驾驶前取得符合 registration 或 in-transit permit 要求的保险。", "source_id": "ny-in-transit"},
    {"id": "ny-buyer-permit", "order": 40, "phase": "before_driving", "text_en": "For a vehicle bought in New York and taken out of state, obtain an interstate in-transit permit at DMV or tow/trailer it.", "text_zh": "在纽约购车并运往外州时，到 DMV 取得 interstate in-transit permit，或使用拖车运输。", "source_id": "ny-in-transit"}
  ],
  "transport_options": [
    {"id": "tow_or_trailer", "allowed": true, "requirements": ["secure_transport_booking"]},
    {"id": "in_transit_permit", "allowed": true, "requirements": ["MV-82ITP", "proof_of_ownership", "proof_of_identity", "acceptable_insurance", "$12.50 fee"], "valid_days": 30},
