  "seller_tasks": [
    {"id": "nj-seller-assign-title", "order": 10, "text_en": "Complete and sign the seller section of the original title; record buyer details, sale date, price, and odometer.", "text_zh": "填写并签署原始 title 的卖方栏，记录买家信息、成交日期、价格和里程。", "source_id": "nj-transfer-ownership"},
    {"id": "nj-seller-bill-sale", "order": 20, "text_en": "Give the buyer a signed bill of sale with buyer name/address, sale date, odometer, and price.", "text_zh": "向买家提供签字的 bill of sale，包含买家姓名/地址、日期、里程和价格。", "source_id": "nj-transfer-ownership"},
    {"id": "nj-seller-remove-plates", "order": 30, "text_en": "Remove the seller's plates; transfer or surrender them, but never leave them for the buyer.", "text_zh": "卖家拆下车牌并转用或交回，绝不能把卖家车牌留给买家使用。", "source_id": "nj-transfer-ownership"}
  ],
  "buyer_tasks": [
    {"id": "nj-buyer-bind-insurance", "order": 10, "phase": "before_driving", "text_en": "Bind New Jersey insurance to the VIN and obtain proof of coverage.", "text_zh": "为该 VIN 购买 New Jersey 保险并取得保险凭证。", "source_id": "nj-preowned-title"},
    {"id": "nj-buyer-appointment", "order": 20, "phase": "registration", "text_en": "Book a Vehicle Center appointment for a private-sale registration/title transfer.", "text_zh": "预约 Vehicle Center 办理私人交易 title/registration 转移。", "source_id": "nj-vehicle-centers"},
    {"id": "nj-buyer-documents", "order": 30, "phase": "registration", "text_en": "Bring the properly assigned original title, BA-49, OS/SS-UTA for an out-of-state title, actual ID/license, proof of NJ insurance, and payment for title, registration, and tax.", "text_zh": "携带正确转签的原始 title、BA-49、外州 title 所需 OS/SS-UTA、本人证件、NJ 保险凭证及 title/registration/税费。", "source_id": "nj-preowned-title"},
    {"id": "nj-buyer-register", "order": 40, "phase": "registration", "text_en": "Title and register within 10 working days; receive plates before driving unless another lawful permit is already valid.", "text_zh": "在 10 个工作日内完成 title 和 registration；除非已有其他有效合法 permit，否则取得车牌后再驾驶。", "source_id": "nj-transfer-ownership"}
  ],
  "transport_options": [
